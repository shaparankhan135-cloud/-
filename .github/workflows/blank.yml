name: SNAPFIX Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract SNAPFIX ZIP
        run: |
          unzip -o SNAPFIX_CLOUD_BUILD_v0.2.1.zip -d snapfix
          find snapfix -maxdepth 3 -type f | head -100

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x snapfix/gradlew || true

      - name: Build APK
        working-directory: snapfix
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNAPFIX-debug-APK
          path: snap
